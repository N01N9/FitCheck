# FitCheck 모델 대장.
#
# 규칙
#   - 제품 경로(product)에는 상업 이용이 가능한 모델만 올린다.
#   - 비교용(baseline)은 품질 기준선으로만 쓰고 제품에 넣지 않는다.
#   - 금지(blocked)는 라이선스 때문에 아예 쓰지 않는다.
#   - license_checked: 사람이 원문을 확인한 날짜. 비어 있으면 아직 확인 전이다.
#
# 확인 방법: HuggingFace 모델 카드의 license 필드 + 저장소의 LICENSE 원문.
# 조사 시점: 2026-09-28

meta:
  checked_on: "2026-09-28"
  hardware: "NVIDIA DGX Spark (GB10, ARM64/aarch64, CUDA 13)"
  container: "nvcr.io/nvidia/vllm:26.08-py3 (NGC 26.08, torch 2.14.0a0, cuda 13.4)"
  note: |
    ARM64라서 flash-attn, xformers, onnxruntime-gpu는 쓸 수 없다. PyTorch 기본 SDPA를 쓴다.
    torch/torchvision 은 NGC 컨테이너 것을 그대로 쓰고 pip 로 설치하지 않는다.

stages:
  # 1. 장면 판단 -----------------------------------------------------------
  scene:
    product:
      - id: qwen3.6-35b-a3b
        repo: Qwen/Qwen3.6-35B-A3B
        serving: vLLM (OpenAI 호환, /v1/chat/completions)
        license: Apache-2.0
        license_checked: "2026-09-28"
        commercial: true
        arm64: ok (vLLM NGC 컨테이너)
        status: not_downloaded      # gx10 회선 문제로 아직 못 받음
        notes: JSON 스키마 강제 출력. Phase 0 T02 와 같은 모델을 재사용한다.
    fallback:
      - id: heuristic-scene
        license: 자체 구현
        commercial: true
        notes: 배경 단색도·피부색 비율·가장자리 복잡도로 case1/2/3 을 추정한다. VLM 없을 때 쓴다.

  # 2. 아이템 찾기·분할 -----------------------------------------------------
  segment:
    product:
      - id: sam3
        repo: facebook/sam3
        license: "other (SAM License / Meta)"
        license_checked: "2026-09-28"
        commercial: "확인 필요"        # 모델 카드가 'other' 로만 표기. 원문 동의 후 확인해야 한다.
        gated: manual                   # HF 로그인 + 약관 동의가 있어야 내려받을 수 있다
        params: 0.9B
        arm64: "미확인 (순수 PyTorch면 가능할 것으로 봄)"
        status: blocked_gated
        notes: |
          텍스트 프롬프트로 개념 단위 분할(open-vocabulary)을 한다. 이 파이프라인의 1순위.
          받으려면 HF 계정으로 약관에 동의하고 토큰을 HF_TOKEN 으로 넘겨야 한다.
    fallback:
      - id: grabcut-boxes
        license: OpenCV(Apache-2.0)/자체 구현
        commercial: true
        notes: |
          SAM 3 없이 파이프라인을 끝까지 돌려 보기 위한 임시 분할기.
          연결 요소 + 배경색 추정으로 아이템 후보를 만든다. 품질 기준선이 아니라 배선 확인용이다.

  # 3. 경계 다듬기 ---------------------------------------------------------
  refine:
    product:
      - id: birefnet-general
        repo: ZhengPeng7/BiRefNet
        license: MIT
        license_checked: "2026-09-28"
        commercial: true
        weights_mb: 423
        arm64: ok (transformers trust_remote_code + timm/kornia)
        status: downloading
        notes: 1순위. 공식 학습 코드가 있어 파인튜닝도 이 모델로 한다.
      - id: birefnet-hr
        repo: ZhengPeng7/BiRefNet_HR
        license: MIT
        license_checked: "2026-09-28"
        commercial: true
        status: not_downloaded
        notes: 고해상도(2048) 버전. 얇은 경계 비교용.
      - id: birefnet-matting
        repo: ZhengPeng7/BiRefNet-matting
        license: MIT
        license_checked: "2026-09-28"
        commercial: true
        status: not_downloaded
        notes: 비치는 소재·머리카락처럼 반투명 경계 비교용.
      - id: birefnet-lite
        repo: ZhengPeng7/BiRefNet_lite
        license: MIT
        license_checked: "2026-09-28"
        commercial: true
        weights_mb: 169
        status: downloading
        notes: 가벼운 버전. 속도 비교와 회선이 느릴 때의 대안.
      - id: ben2-base
        repo: PramaLLC/BEN2
        license: MIT
        license_checked: "2026-09-28"
        commercial: true
        params: 94.6M
        status: not_downloaded
        notes: |
          모델 카드 license 필드가 MIT 다(사용자 메모의 Apache-2.0 과 다름).
          Base 만 쓰고 유료 Refiner/API 는 쓰지 않는다. 공식 학습 코드가 없어 파인튜닝은 후순위.
    baseline:
      - id: border-color
        license: 자체 구현
        commercial: true
        notes: 가장자리 색을 배경으로 보는 고전 방식. GPU 없이 도는 기준선.
    blocked:
      - id: rmbg-2.0
        repo: briaai/RMBG-2.0
        license: "Bria RSC (비상업)"
        reason: 제품 경로 금지. 품질 비교로만.

  # 5. 복원 / 6. 다각도 -----------------------------------------------------
  complete_views:
    product:
      - id: qwen-image-edit-2511
        repo: Qwen/Qwen-Image-Edit-2511
        license: Apache-2.0
        license_checked: "2026-09-28"
        commercial: true
        status: not_downloaded
        notes: 여러 장 입력 지원. try-off 와 뒤·옆면 생성에 쓴다. 약 20GB 급이라 회선이 필요하다.
      - id: mv-adapter
        repo: huanngzh/MV-Adapter
        license: Apache-2.0
        license_checked: "2026-09-28"
        commercial: true
        status: not_downloaded
        notes: 다각도 전용 어댑터. SD 계열 베이스 모델의 라이선스도 따로 확인해야 한다.
    quality_check:
      - id: marqo-fashionsiglip
        repo: Marqo/marqo-fashionSigLIP
        license: Apache-2.0
        license_checked: "2026-09-28"
        commercial: true
        status: not_downloaded
        notes: 생성한 면이 원본 옷과 같은 옷인지 임베딩 유사도로 검사한다.
    blocked:
      - id: flux-dev 계열
        reason: 비상업 라이선스
      - id: catvton / idm-vton / fitdit
        reason: 비상업 라이선스

  # 7. 3D -----------------------------------------------------------------
  mesh:
    candidates:
      - id: trellis-image-large
        repo: microsoft/TRELLIS-image-large
        license: MIT
        license_checked: "2026-09-28"
        commercial: true
        arm64: "미확인 (커스텀 CUDA 커널·flash-attn 의존 가능성이 커서 위험)"
        status: not_downloaded
      - id: sam-3d-objects
        repo: facebook/sam-3d-objects
        license: "other (SAM License / Meta)"
        license_checked: "2026-09-28"
        commercial: "확인 필요"
        gated: manual
        status: blocked_gated
    blocked:
      - id: hunyuan3d 계열
        reason: Tencent Hunyuan 라이선스가 한국을 명시적으로 제외한다.

datasets:
  allowed:
    - id: fashionpedia
      license: CC BY 4.0 (주석). 이미지는 Flickr 개별 라이선스
      use: case2 분할 평가·학습에만. 경계가 거친 다각형이라 경계 정밀 모델 학습에는 쓰지 않는다.
      license_checked: "2026-09-28"
    - id: wikimedia-commons
      license: 파일마다 다름 (CC0 / PD / CC BY / CC BY-SA)
      use: 테스트 사진. sources.csv 에 파일별 라이선스를 적는다.
      license_checked: "2026-09-28"
    - id: pexels / unsplash
      license: 각 사이트 라이선스 (상업 이용 가능, 재배포 제한 있음)
      use: 테스트 사진. 원본 재배포 금지라 저장소에 커밋하지 않는다.
  blocked:
    - id: deepfashion2 / modanet / viton-hd / dresscode / dis5k
      reason: 비상업 또는 연구 전용
